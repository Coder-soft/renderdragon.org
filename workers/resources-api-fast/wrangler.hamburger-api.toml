name = "hamburger-api"
main = "index.js"
compatibility_date = "2024-01-01"

# Same speed layer as workers/resources-api-fast, applied to the script the
# router uses for the resources pool. Rate limiter namespace id is 1001 here.
[[kv_namespaces]]
binding = "RESOURCES_KV"
id = "a399531203c442ef975292d7ce365a4a"

[[kv_namespaces]]
binding = "CREDITS_KV"
id = "34f9ccdc9d2c4f308424c7859aa0bb62"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
